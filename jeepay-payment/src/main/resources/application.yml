server:
  port: 9216 #设置端口

spring:
  application:
    name: jeepay-payment
  data:
    redis:
      database: 3    #1库：运营平台  #2库：商户系统 #3库：支付网关

# OpenAPI / Knife4j APIDOC 文档
# 安全加固 S9: 生产环境通过环境变量 SPRINGDOC_ENABLED=false / KNIFE4J_ENABLED=false 关闭文档暴露
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '支付网关'
      paths-to-match: '/**'
      packages-to-scan: com.jeequan.jeepay.pay.ctrl.test
    - group: 'merchant-api'
      display-name: '商户对外接口（国际四方）'
      paths-to-match: '/api/**'
      packages-to-scan: com.jeequan.jeepay.pay.ctrl.payorder,com.jeequan.jeepay.pay.ctrl.refund,com.jeequan.jeepay.pay.ctrl.transfer
knife4j:
  enable: ${KNIFE4J_ENABLED:false}
  setting:
    language: zh_cn
    swagger-model-name: 公共响应
  documents:
    - name: API
      locations: classpath:markdown/doc/*
      group: default

# 安全加固 S8: actuator 端点最小化暴露；prometheus/metrics 仅在生产以独立 management 端口暴露
management:
  server:
    port: ${MGMT_PORT:0}
  endpoints:
    web:
      exposure:
        include: health,info
