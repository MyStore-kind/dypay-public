# ============================================================
# Dypay 国际支付 - 部署专用 compose
# 与 docker-compose.yml 的区别：
#   1. 包含 ui-manager / ui-merchant 两个前端服务
#   2. 后端使用多阶段 Dockerfile.multistage（无需预先 mvn package）
#   3. 显式 healthcheck + depends_on condition: service_healthy
#   4. 所有密码/密钥来自 deploy/.env，绝不硬编码
#
# 用法：
#   bash deploy/deploy.sh    （脚本会自动指向本文件）
# 手动：
#   docker compose --env-file deploy/.env -f docker-compose.yml -f docker-compose.deploy.yml up -d --build
# ============================================================

services:
  # ----- MySQL -----
  mysql:
    image: mysql:8.0
    container_name: dypay-mysql
    restart: always
    environment:
      LANG: C.UTF-8
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-dypaydb}"
      MYSQL_USER: "${MYSQL_USER:-dypay}"
      MYSQL_PASSWORD: "${MYSQL_USER_PASSWORD}"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [dypay-net]

  # ----- Redis -----
  redis:
    image: redis:7-alpine
    container_name: dypay-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data
    networks: [dypay-net]

  # ----- RocketMQ NameServer -----
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: dypay-rocketmq-namesrv
    restart: always
    user: "0:0"
    environment:
      HEAP_OPTS: "-Xms256m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9876'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - rocketmq_data:/home/rocketmq/logs
    networks: [dypay-net]

  # ----- RocketMQ Broker -----
  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: dypay-rocketmq-broker
    restart: always
    user: "0:0"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: sh mqbroker -n rocketmq-namesrv:9876
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10911'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks: [dypay-net]

  # ----- dypay-payment（支付网关 9216） -----
  payment:
    build:
      context: .
      dockerfile: jeepay-payment/Dockerfile.multistage
    image: dypay-payment:multistage
    container_name: dypay-payment
    restart: always
    ports:
      - "${PAYMENT_PORT:-9216}:9216"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${PAYMENT_JAVA_OPTS:--XX:+UseG1GC -Xms512m -Xmx1g}"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-dypaydb}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      ROCKETMQ_NAME_SERVER: "rocketmq-namesrv:9876"
      JEEPAY_JWT_SECRET: "${JEEPAY_JWT_SECRET}"
      STRIPE_API_KEY: "${STRIPE_API_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      PAYPAL_WEBHOOK_ID: "${PAYPAL_WEBHOOK_ID:-}"
      PAYPAL_API_BASE: "${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}"
      RISK_CONTROL_ENABLED: "${RISK_CONTROL_ENABLED:-true}"
      RISK_GRAYSCALE: "${RISK_GRAYSCALE:-10}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9216'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rocketmq-broker: { condition: service_healthy }
    volumes:
      - ./logs/payment:/jeepayhomes/service/logs
    networks: [dypay-net]

  # ----- dypay-manager（运营后端 9217） -----
  manager:
    build:
      context: .
      dockerfile: jeepay-manager/Dockerfile.multistage
    image: dypay-manager:multistage
    container_name: dypay-manager
    restart: always
    ports:
      - "${MANAGER_PORT:-9217}:9217"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${MANAGER_JAVA_OPTS:--XX:+UseG1GC -Xms512m -Xmx1g}"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-dypaydb}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      ROCKETMQ_NAME_SERVER: "rocketmq-namesrv:9876"
      JEEPAY_JWT_SECRET: "${JEEPAY_JWT_SECRET}"
      SCHEDULE_ENABLED: "${SCHEDULE_ENABLED:-true}"
      FIXER_API_KEY: "${FIXER_API_KEY:-}"
      FIXER_BASE_URL: "${FIXER_BASE_URL:-https://api.apilayer.com/fixer}"
      RATE_REFRESH_CRON: "${RATE_REFRESH_CRON:-0 15 * * * ?}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      RISK_ALERT_ENABLED: "${RISK_ALERT_ENABLED:-true}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      RISK_CONTROL_ENABLED: "${RISK_CONTROL_ENABLED:-true}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9217'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rocketmq-broker: { condition: service_healthy }
    volumes:
      - ./logs/manager:/jeepayhomes/service/logs
    networks: [dypay-net]

  # ----- dypay-merchant（商户后端 9218） -----
  merchant:
    build:
      context: .
      dockerfile: jeepay-merchant/Dockerfile.multistage
    image: dypay-merchant:multistage
    container_name: dypay-merchant
    restart: always
    ports:
      - "${MERCHANT_PORT:-9218}:9218"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${MERCHANT_JAVA_OPTS:--XX:+UseG1GC -Xms512m -Xmx1g}"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-dypaydb}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      ROCKETMQ_NAME_SERVER: "rocketmq-namesrv:9876"
      JEEPAY_JWT_SECRET: "${JEEPAY_JWT_SECRET}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9218'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rocketmq-broker: { condition: service_healthy }
    volumes:
      - ./logs/merchant:/jeepayhomes/service/logs
    networks: [dypay-net]

  # ----- 运营前端 nginx 8083 -----
  ui-manager:
    build:
      context: ../jeepay-ui/jeepay-ui-manager
      dockerfile: Dockerfile.multistage
    image: dypay-ui-manager:multistage
    container_name: dypay-ui-manager
    restart: always
    ports:
      - "${UI_MANAGER_PORT:-8083}:80"
    depends_on:
      manager: { condition: service_healthy }
    networks: [dypay-net]

  # ----- 商户前端 nginx 8082 -----
  ui-merchant:
    build:
      context: ../jeepay-ui/jeepay-ui-merchant
      dockerfile: Dockerfile.multistage
    image: dypay-ui-merchant:multistage
    container_name: dypay-ui-merchant
    restart: always
    ports:
      - "${UI_MERCHANT_PORT:-8082}:80"
    depends_on:
      merchant: { condition: service_healthy }
    networks: [dypay-net]

networks:
  dypay-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rocketmq_data:
